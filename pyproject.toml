[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lua-lsm-testsuite"
version = "0.0.0"
description = "Out-of-tree QEMU matrix harness for the Linux Lua LSM"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[project.scripts]
lua-lsm-testsuite = "harness.__main__:main"

[tool.setuptools]
packages = ["harness"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
