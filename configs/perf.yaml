# UnixBench-anchored perf matrix. Smaller than smoke (perf cells are slower)
# and pinned to `kind: perf` so bug-hunt knobs never distort timing.
#
# Cells default to `policy: smoke` so hook deltas are non-zero; add `none`
# to the policy axis for a same-environment lua-on/lua-off comparison.
# Results are collected by `python -m harness perf-report` (report-only).
name: perf
workload: unixbench
defaults:
  kvm_required: true
  kconfig_profile: standard
  kind: perf
  policy: smoke
  unixbench_build: true
axes:
  policy: [none, smoke]
  lvm_pool_max: [16, 64]
  lsm:
    - "capability,bpf,lua"
    - "capability,yama,lua,selinux,bpf,integrity"
  nodebug: [true, false]
exclude: []
